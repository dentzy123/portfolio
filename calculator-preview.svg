<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="calc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d17" />
      <stop offset="50%" stop-color="#121324" />
      <stop offset="100%" stop-color="#08080f" />
    </linearGradient>
    <radialGradient id="calc-glow1" cx="30%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ff9f0a" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ff9f0a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="calc-glow2" cx="75%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#7c6cfc" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7c6cfc" stop-opacity="0" />
    </radialGradient>

    <!-- Calculator Window Frame -->
    <linearGradient id="window-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1b29" />
      <stop offset="100%" stop-color="#12111c" />
    </linearGradient>
    <linearGradient id="window-titlebar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242236" />
      <stop offset="100%" stop-color="#1b1a2c" />
    </linearGradient>
    <linearGradient id="display-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0a13" />
      <stop offset="100%" stop-color="#0e0d17" />
    </linearGradient>

    <!-- Button Gradients -->
    <linearGradient id="btn-num" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34324a" />
      <stop offset="100%" stop-color="#262438" />
    </linearGradient>
    <linearGradient id="btn-op" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffad33" />
      <stop offset="100%" stop-color="#f58700" />
    </linearGradient>
    <linearGradient id="btn-action" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4d4dc" />
      <stop offset="100%" stop-color="#a4a4b2" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="calc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#ff9f0a" flood-opacity="0.15" />
    </filter>
    <filter id="btn-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="380" fill="url(#calc-bg)" />
  <rect width="600" height="380" fill="url(#calc-glow1)" />
  <rect width="600" height="380" fill="url(#calc-glow2)" />

  <!-- Background Grid -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="3 3">
    <line x1="50" y1="0" x2="50" y2="380" />
    <line x1="140" y1="0" x2="140" y2="380" />
    <line x1="460" y1="0" x2="460" y2="380" />
    <line x1="550" y1="0" x2="550" y2="380" />
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="190" x2="600" y2="190" />
    <line x1="0" y1="310" x2="600" y2="310" />
  </g>

  <!-- Left Info Card -->
  <g transform="translate(30, 95)" opacity="0.9">
    <rect width="135" height="64" rx="14" fill="#181729" stroke="rgba(255,255,255,0.09)" stroke-width="1.2" filter="url(#calc-shadow)" />
    <circle cx="28" cy="32" r="14" fill="#ff9f0a" opacity="0.2" />
    <text x="21" y="38" font-family="sans-serif" font-size="16" fill="#ff9f0a">🐍</text>
    <text x="50" y="26" fill="#9d9abf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">PYTHON ENGINE</text>
    <text x="50" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Tkinter GUI</text>
  </g>

  <g transform="translate(25, 230)" opacity="0.9">
    <rect width="140" height="64" rx="14" fill="#181729" stroke="rgba(255,255,255,0.09)" stroke-width="1.2" filter="url(#calc-shadow)" />
    <circle cx="28" cy="32" r="14" fill="#7c6cfc" opacity="0.2" />
    <text x="21" y="38" font-family="sans-serif" font-size="14" fill="#a594ff">⚡</text>
    <text x="50" y="26" fill="#9d9abf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">WEB INTERACTIVE</text>
    <text x="50" y="46" fill="#a594ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Modal Popup</text>
  </g>

  <!-- Right Info Card -->
  <g transform="translate(440, 140)" opacity="0.9">
    <rect width="135" height="66" rx="14" fill="#181729" stroke="rgba(255,255,255,0.09)" stroke-width="1.2" filter="url(#calc-shadow)" />
    <circle cx="26" cy="33" r="13" fill="#22c55e" opacity="0.2" />
    <text x="20" y="38" font-family="sans-serif" font-size="13" fill="#4ade80">✓</text>
    <text x="48" y="26" fill="#9d9abf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">PRECISION</text>
    <text x="48" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Error Handling</text>
  </g>

  <!-- ================= CALCULATOR WINDOW (CENTER) ================= -->
  <g transform="translate(185, 14)" filter="url(#calc-shadow)">
    <!-- Window Container -->
    <rect width="230" height="352" rx="20" fill="url(#window-body)" stroke="rgba(255,255,255,0.16)" stroke-width="1.5" />

    <!-- Window Titlebar -->
    <g>
      <path d="M0 20 Q0 0 20 0 L210 0 Q230 0 230 20 L230 32 L0 32 Z" fill="url(#window-titlebar)" />
      <line x1="0" y1="32" x2="230" y2="32" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      
      <!-- Traffic Light Dots -->
      <circle cx="16" cy="16" r="4.5" fill="#ff5f57" />
      <circle cx="28" cy="16" r="4.5" fill="#febc2e" />
      <circle cx="40" cy="16" r="4.5" fill="#28c840" />

      <!-- Window Title -->
      <text x="115" y="19.5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Modern Calculator</text>
    </g>

    <!-- Calculator Display Frame -->
    <g transform="translate(14, 42)">
      <rect width="202" height="64" rx="10" fill="url(#display-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      
      <!-- History / Expression text -->
      <text x="190" y="22" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif" font-size="10" font-weight="500" text-anchor="end">1,250 × 8.5 + 420</text>
      
      <!-- Main Output Value -->
      <text x="190" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif" font-size="25" font-weight="700" text-anchor="end" letter-spacing="-0.5">11,045</text>
    </g>

    <!-- Buttons Grid (5 Rows x 4 Cols matching cal.py) -->
    <g transform="translate(14, 116)">
      
      <!-- ROW 0: C, ±, %, ÷ -->
      <!-- C -->
      <g transform="translate(0, 0)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-action)" />
        <text x="23" y="25" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">C</text>
      </g>
      <!-- ± -->
      <g transform="translate(52, 0)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-action)" />
        <text x="23" y="25" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">±</text>
      </g>
      <!-- % -->
      <g transform="translate(104, 0)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-action)" />
        <text x="23" y="25" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">%</text>
      </g>
      <!-- ÷ -->
      <g transform="translate(156, 0)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-op)" />
        <text x="23" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" text-anchor="middle">÷</text>
      </g>

      <!-- ROW 1: 7, 8, 9, × -->
      <!-- 7 -->
      <g transform="translate(0, 46)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-num)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        <text x="23" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">7</text>
      </g>
      <!-- 8 -->
      <g transform="translate(52, 46)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-num)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        <text x="23" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">8</text>
      </g>
      <!-- 9 -->
      <g transform="translate(104, 46)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-num)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        <text x="23" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">9</text>
      </g>
      <!-- × -->
      <g transform="translate(156, 46)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-op)" />
        <text x="23" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="middle">×</text>
      </g>

      <!-- ROW 2: 4, 5, 6, − -->
      <!-- 4 -->
      <g transform="translate(0, 92)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-num)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        <text x="23" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">4</text>
      </g>
      <!-- 5 -->
      <g transform="translate(52, 92)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-num)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        <text x="23" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">5</text>
      </g>
      <!-- 6 -->
      <g transform="translate(104, 92)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-num)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        <text x="23" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">6</text>
      </g>
      <!-- − -->
      <g transform="translate(156, 92)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-op)" />
        <text x="23" y="25" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" text-anchor="middle">−</text>
      </g>

      <!-- ROW 3: 1, 2, 3, + -->
      <!-- 1 -->
      <g transform="translate(0, 138)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-num)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        <text x="23" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">1</text>
      </g>
      <!-- 2 -->
      <g transform="translate(52, 138)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-num)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        <text x="23" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">2</text>
      </g>
      <!-- 3 -->
      <g transform="translate(104, 138)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-num)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        <text x="23" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">3</text>
      </g>
      <!-- + -->
      <g transform="translate(156, 138)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-op)" />
        <text x="23" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" text-anchor="middle">+</text>
      </g>

      <!-- ROW 4: 0 (wide), ., = -->
      <!-- 0 (Double width) -->
      <g transform="translate(0, 184)" filter="url(#btn-shadow)">
        <rect width="98" height="40" rx="8" fill="url(#btn-num)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        <text x="49" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">0</text>
      </g>
      <!-- . -->
      <g transform="translate(104, 184)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-num)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
        <text x="23" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle">.</text>
      </g>
      <!-- = -->
      <g transform="translate(156, 184)" filter="url(#btn-shadow)">
        <rect width="46" height="40" rx="8" fill="url(#btn-op)" />
        <text x="23" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" text-anchor="middle">=</text>
      </g>

    </g>
  </g>
</svg>
