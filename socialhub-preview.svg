<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="sh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0d1b" />
      <stop offset="50%" stop-color="#14132b" />
      <stop offset="100%" stop-color="#0a0a14" />
    </linearGradient>
    <radialGradient id="sh-glow1" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#7c6cfc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7c6cfc" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sh-glow2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#fc6c9e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fc6c9e" stop-opacity="0" />
    </radialGradient>

    <!-- Phone Frame & Glass -->
    <linearGradient id="phone-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2942" />
      <stop offset="100%" stop-color="#151422" />
    </linearGradient>
    <linearGradient id="phone-inner-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0f18" />
      <stop offset="100%" stop-color="#090910" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c6cfc" />
      <stop offset="100%" stop-color="#fc6c9e" />
    </linearGradient>
    <linearGradient id="story-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1c33" />
      <stop offset="100%" stop-color="#161526" />
    </linearGradient>
    <linearGradient id="post-img-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <filter id="phone-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7c6cfc" flood-opacity="0.25" />
    </filter>
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ff3366" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="380" fill="url(#sh-bg)" />
  <rect width="600" height="380" fill="url(#sh-glow1)" />
  <rect width="600" height="380" fill="url(#sh-glow2)" />

  <!-- Decorative Tech Background Grid & Particles -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="3 3">
    <line x1="40" y1="0" x2="40" y2="380" />
    <line x1="120" y1="0" x2="120" y2="380" />
    <line x1="480" y1="0" x2="480" y2="380" />
    <line x1="560" y1="0" x2="560" y2="380" />
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="300" x2="600" y2="300" />
  </g>

  <!-- Left Floating Badge / Stats -->
  <g transform="translate(30, 85)" opacity="0.9">
    <rect width="125" height="58" rx="14" fill="#181729" stroke="rgba(255,255,255,0.09)" stroke-width="1.2" filter="url(#phone-shadow)" />
    <circle cx="26" cy="29" r="14" fill="url(#accent-grad)" />
    <path d="M22 29 L25 32 L31 26" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="48" y="24" fill="#9d9abf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">ONLINE USERS</text>
    <text x="48" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">12,480+</text>
  </g>

  <g transform="translate(25, 230)" opacity="0.9">
    <rect width="135" height="64" rx="14" fill="#181729" stroke="rgba(255,255,255,0.09)" stroke-width="1.2" filter="url(#phone-shadow)" />
    <circle cx="28" cy="32" r="14" fill="#ff4b72" opacity="0.2" />
    <path d="M28 27 C24 23, 19 28, 28 36 C37 28, 32 23, 28 27 Z" fill="#ff4b72" />
    <text x="50" y="26" fill="#9d9abf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">LIVE SYNC</text>
    <text x="50" y="45" fill="#a594ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Firestore 🔥</text>
  </g>

  <!-- Right Floating Badge -->
  <g transform="translate(445, 130)" opacity="0.9">
    <rect width="130" height="60" rx="14" fill="#181729" stroke="rgba(255,255,255,0.09)" stroke-width="1.2" filter="url(#phone-shadow)" />
    <circle cx="26" cy="30" r="13" fill="#6366f1" opacity="0.25" />
    <text x="22" y="35" font-family="sans-serif" font-size="14" fill="#818cf8">◈</text>
    <text x="48" y="24" fill="#9d9abf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">FRAMEWORK</text>
    <text x="48" y="43" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Flutter / Dart</text>
  </g>

  <!-- ================= PHONE CONTAINER (CENTER) ================= -->
  <g transform="translate(180, 12)" filter="url(#phone-shadow)">
    <!-- Phone Bezel -->
    <rect x="0" y="0" width="240" height="358" rx="34" fill="url(#phone-body)" stroke="rgba(255,255,255,0.18)" stroke-width="1.8" />
    
    <!-- Phone Screen Inner -->
    <g transform="translate(6, 6)">
      <clipPath id="screen-clip">
        <rect x="0" y="0" width="228" height="346" rx="28" />
      </clipPath>
      
      <rect x="0" y="0" width="228" height="346" rx="28" fill="url(#phone-inner-bg)" />

      <!-- Content within screen -->
      <g clip-path="url(#screen-clip)">
        
        <!-- Status Bar -->
        <text x="22" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif" font-size="10" font-weight="600">9:41</text>
        
        <!-- Dynamic Island / Notch -->
        <rect x="74" y="9" width="80" height="18" rx="9" fill="#000000" />
        <circle cx="85" cy="18" r="4.5" fill="#121218" />
        <circle cx="85" cy="18" r="1.8" fill="#1d4ed8" opacity="0.8" />
        <circle cx="140" cy="18" r="3" fill="#1a1a24" />

        <!-- Status Icons (WiFi + Battery) -->
        <g transform="translate(185, 12)" fill="#e2e8f0">
          <path d="M0 8 A6 6 0 0 1 12 8" stroke="#e2e8f0" stroke-width="1.4" fill="none" stroke-linecap="round" />
          <path d="M2 10 A4 4 0 0 1 10 10" stroke="#e2e8f0" stroke-width="1.4" fill="none" stroke-linecap="round" />
          <rect x="18" y="1" width="16" height="8" rx="2.5" fill="none" stroke="#e2e8f0" stroke-width="1" />
          <rect x="20" y="3" width="11" height="4" rx="1.5" fill="#10b981" />
        </g>

        <!-- App Header Bar -->
        <g transform="translate(14, 38)">
          <!-- App Logo / Title -->
          <text x="0" y="16" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="-0.5">SocialHub</text>
          
          <!-- Header Action Icons -->
          <!-- Heart / Notification -->
          <g transform="translate(150, 2)">
            <path d="M8 3.5 C5.5 0.5, 1.5 4, 8 11 C14.5 4, 10.5 0.5, 8 3.5 Z" fill="none" stroke="#f1f5f9" stroke-width="1.4" />
            <circle cx="13" cy="2" r="3.5" fill="#ef4444" filter="url(#badge-glow)" />
          </g>
          <!-- Message Bubble -->
          <g transform="translate(178, 2)">
            <path d="M2 3 C2 1.5, 3.5 0, 8 0 C12.5 0, 14 1.5, 14 3 C14 7, 10 7.5, 8 9 L5 11 L5 8 C3 8, 2 7, 2 3 Z" fill="none" stroke="#f1f5f9" stroke-width="1.4" />
            <circle cx="13" cy="1" r="3.5" fill="#7c6cfc" />
            <text x="11.5" y="3.5" font-family="sans-serif" font-size="6" font-weight="bold" fill="#fff">3</text>
          </g>
        </g>

        <!-- Stories Tray -->
        <g transform="translate(12, 68)">
          <!-- Story 1 (Add Story) -->
          <g transform="translate(0, 0)">
            <circle cx="18" cy="18" r="18" fill="#1e1e2d" stroke="#33324a" stroke-width="1.5" />
            <circle cx="18" cy="18" r="13" fill="#2d2b45" />
            <text x="14" y="22" font-family="sans-serif" font-size="13" fill="#a594ff" font-weight="bold">+</text>
            <text x="6" y="44" fill="#94a3b8" font-family="sans-serif" font-size="7.5" font-weight="500">Your story</text>
          </g>

          <!-- Story 2 (denmar.dev) -->
          <g transform="translate(48, 0)">
            <circle cx="18" cy="18" r="18" fill="none" stroke="url(#story-ring)" stroke-width="2.2" />
            <circle cx="18" cy="18" r="14" fill="#7c6cfc" />
            <text x="13" y="22" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="bold">D</text>
            <text x="4" y="44" fill="#f8fafc" font-family="sans-serif" font-size="7.5" font-weight="600">denmar</text>
          </g>

          <!-- Story 3 (alex_ui) -->
          <g transform="translate(96, 0)">
            <circle cx="18" cy="18" r="18" fill="none" stroke="url(#story-ring)" stroke-width="2.2" />
            <circle cx="18" cy="18" r="14" fill="#06b6d4" />
            <text x="13" y="22" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="bold">A</text>
            <text x="8" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="7.5">alex_ui</text>
          </g>

          <!-- Story 4 (sarah) -->
          <g transform="translate(144, 0)">
            <circle cx="18" cy="18" r="18" fill="none" stroke="url(#story-ring)" stroke-width="2.2" />
            <circle cx="18" cy="18" r="14" fill="#ec4899" />
            <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#ffffff" font-weight="bold">S</text>
            <text x="7" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="7.5">sarah.k</text>
          </g>
        </g>

        <!-- Feed Post Card -->
        <g transform="translate(10, 122)">
          <!-- Card Background -->
          <rect width="208" height="175" rx="14" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

          <!-- Post Header -->
          <g transform="translate(10, 10)">
            <circle cx="11" cy="11" r="11" fill="url(#story-ring)" />
            <circle cx="11" cy="11" r="9.5" fill="#7c6cfc" />
            <text x="8" y="14" font-family="sans-serif" font-size="8" fill="#ffffff" font-weight="bold">D</text>

            <text x="28" y="10" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700">denmar.dev</text>
            <text x="28" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Cebu, Philippines • 2h</text>
            
            <!-- Three dots menu -->
            <circle cx="178" cy="8" r="1.5" fill="#94a3b8" />
            <circle cx="183" cy="8" r="1.5" fill="#94a3b8" />
            <circle cx="188" cy="8" r="1.5" fill="#94a3b8" />
          </g>

          <!-- Post Image / Media Preview -->
          <g transform="translate(10, 38)">
            <rect width="188" height="84" rx="8" fill="url(#post-img-grad)" />
            
            <!-- Inner Post Illustration: Flutter UI Banner -->
            <circle cx="150" cy="40" r="30" fill="#ffffff" opacity="0.08" />
            <rect x="15" y="16" width="105" height="18" rx="5" fill="rgba(0,0,0,0.3)" />
            <text x="22" y="29" fill="#38bdf8" font-family="monospace" font-size="8" font-weight="bold">⚡ Flutter 3.22</text>
            
            <rect x="15" y="40" width="130" height="24" rx="5" fill="rgba(255,255,255,0.12)" backdrop-filter="blur(4px)" />
            <text x="22" y="52" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="700">SocialHub Live Feed UI</text>
            <text x="22" y="60" fill="#e0e7ff" font-family="sans-serif" font-size="6.5">Real-Time Cloud Firestore Sync</text>
            
            <!-- Floating Flutter Icon -->
            <g transform="translate(152, 22)">
              <polygon points="12,0 24,12 18,18 6,6" fill="#40c4ff" />
              <polygon points="18,18 24,24 16,32 10,26" fill="#0288d1" />
              <polygon points="12,24 18,18 24,24 18,30" fill="#01579b" />
            </g>
          </g>

          <!-- Post Action Icons -->
          <g transform="translate(12, 130)">
            <!-- Liked Heart -->
            <path d="M6 3 C4 0.5, 0.5 3, 6 9 C11.5 3, 8 0.5, 6 3 Z" fill="#ef4444" />
            <text x="14" y="8" fill="#f1f5f9" font-family="sans-serif" font-size="7.5" font-weight="600">1.8k</text>

            <!-- Comment Bubble -->
            <g transform="translate(48, 0)">
              <path d="M1 2 C1 0.8, 2 0, 5.5 0 C9 0, 10 0.8, 10 2 C10 4.5, 7.5 5, 5.5 6 L3.5 7.5 L3.5 6 C2 6, 1 5, 1 2 Z" fill="none" stroke="#cbd5e1" stroke-width="1.1" />
              <text x="13" y="6" fill="#cbd5e1" font-family="sans-serif" font-size="7.5" font-weight="500">284</text>
            </g>

            <!-- Share Paper Plane -->
            <g transform="translate(90, 0)">
              <path d="M0 0 L8 3.5 L0 7 L2 3.5 Z" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linejoin="round" />
            </g>

            <!-- Bookmark -->
            <g transform="translate(170, 0)">
              <path d="M0 0 L7 0 L7 8 L3.5 5.5 L0 8 Z" fill="none" stroke="#cbd5e1" stroke-width="1" />
            </g>
          </g>

          <!-- Post Caption snippet -->
          <text x="12" y="152" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600">denmar.dev <tspan fill="#94a3b8" font-weight="normal">Animated social feed with Flutter &amp; Firebase 🚀</tspan></text>
          <text x="12" y="163" fill="#7c6cfc" font-family="sans-serif" font-size="7" font-weight="500">#flutter #mobile #firebase #ui</text>
        </g>

        <!-- Bottom Navigation Bar (Glassmorphic) -->
        <g transform="translate(0, 305)">
          <rect width="228" height="42" fill="#121120" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
          
          <!-- Home (Active) -->
          <g transform="translate(26, 8)">
            <circle cx="8" cy="8" r="11" fill="url(#accent-grad)" opacity="0.2" />
            <path d="M3 11 L8 4 L13 11 L11 11 L11 15 L5 15 L5 11 Z" fill="#a594ff" />
          </g>

          <!-- Search -->
          <g transform="translate(70, 12)">
            <circle cx="5" cy="5" r="4" fill="none" stroke="#64748b" stroke-width="1.2" />
            <line x1="8" y1="8" x2="11" y2="11" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" />
          </g>

          <!-- Create (+) button -->
          <g transform="translate(104, 5)">
            <circle cx="10" cy="10" r="10" fill="url(#accent-grad)" filter="url(#badge-glow)" />
            <line x1="10" y1="6" x2="10" y2="14" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
            <line x1="6" y1="10" x2="14" y2="10" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" />
          </g>

          <!-- Activity / Heart -->
          <g transform="translate(148, 12)">
            <path d="M5 2.5 C3.5 0.5, 0.8 2.5, 5 7 C9.2 2.5, 6.5 0.5, 5 2.5 Z" fill="none" stroke="#64748b" stroke-width="1.2" />
          </g>

          <!-- Profile Avatar -->
          <g transform="translate(186, 10)">
            <circle cx="6" cy="6" r="6.5" fill="#7c6cfc" stroke="#38bdf8" stroke-width="1" />
            <text x="4" y="8.5" font-family="sans-serif" font-size="6" fill="#fff" font-weight="bold">D</text>
          </g>

          <!-- Home indicator bar -->
          <rect x="74" y="32" width="80" height="3" rx="1.5" fill="#475569" />
        </g>

      </g>
    </g>
  </g>
</svg>
